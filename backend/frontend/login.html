<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at bottom left, #1e293b, #0f172a);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 380px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .form-control {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white !important;
            padding: 12px;
            border-radius: 12px;
        }
        .form-control:focus {
            background: rgba(0, 0, 0, 0.3);
            border-color: #3b82f6;
            box-shadow: none;
        }
        .btn-primary {
            background: #3b82f6;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
        .text-secondary { color: #94a3b8 !important; }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center mb-4 fw-bold">Welcome Back</h3>
    
    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label text-secondary small">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="name@company.com" required>
        </div>
        <div class="mb-4">
            <label class="form-label text-secondary small">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Login to Dashboard</button>
    </form>
    
    <div class="text-center">
        <a href="signup.html" class="text-info text-decoration-none small">Don't have an account? Sign Up</a>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(event) {
    event.preventDefault(); // Prevents page reload

    // 1. Grab values from the inputs
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        // 2. Send request to backend
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
            // 3. Store user data in local storage
            localStorage.setItem("token", data.token);
            localStorage.setItem("username", data.username);
            localStorage.setItem("role", data.role);

            // 4. Redirect based on role
            if (data.role === "admin") {
                window.location.href = "admin.html";
            } else {
                window.location.href = "index.html"; 
            }
        } else {
            // 5. Show error message from server (e.g., "Invalid credentials")
            alert(data.error || "Login Failed");
        }
    } catch (error) {
        console.error("Login Error:", error);
        alert("Connection to server failed. Is your backend running?");
    }
});
</script>
</body>
</html>
