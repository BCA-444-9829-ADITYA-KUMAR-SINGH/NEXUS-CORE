<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary-cyan: #00f2ff; --bg-dark: #0f172a; --card-bg: rgba(30, 41, 59, 0.7); }
        body { background: radial-gradient(circle at top left, #1e293b, #0f172a); color: #e2e8f0; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .profile-header { background: linear-gradient(135deg, rgba(0, 242, 255, 0.1), rgba(138, 43, 226, 0.1)); border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding: 60px 0; }
        .profile-card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 40px; margin-top: -50px; }
        .avatar-circle { width: 100px; height: 100px; background: linear-gradient(45deg, var(--primary-cyan), #8a2be2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; color: white; margin: 0 auto 20px; box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); }
        .info-label { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .info-value { font-weight: 600; color: white; margin-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 10px; }
        .badge-role { background: rgba(0, 242, 255, 0.1); color: var(--primary-cyan); border: 1px solid var(--primary-cyan); padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="profile-header text-center">
    <div class="container">
        <h2 class="fw-bold">User Profile</h2>
        <p class="text-secondary">Nexus Core Authentication Verified</p>
    </div>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="profile-card">
                <div class="text-center mb-5">
                    <div class="avatar-circle" id="userInitial">U</div>
                    <h3 class="fw-bold mb-1" id="dispName">Loading...</h3>
                    <span class="badge-role" id="dispRole">USER_NODE</span>
                </div>

                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="info-label"><i class="bi bi-person me-2"></i>Username</div>
                        <div class="info-value" id="valUsername">---</div>
                    </div>
                    <div class="col-md-6">
                        <div class="info-label"><i class="bi bi-envelope me-2"></i>Primary Email</div>
                        <div class="info-value" id="valEmail">---</div>
                    </div>
                    <div class="col-md-6">
                        <div class="info-label"><i class="bi bi-briefcase me-2"></i>Profession</div>
                        <div class="info-value" id="valProfession">---</div>
                    </div>
                    <div class="col-md-6">
                        <div class="info-label"><i class="bi bi-shield-lock me-2"></i>Account Status</div>
                        <div class="info-value text-success">Active / Encrypted</div>
                    </div>
                </div>

                <div class="mt-4 mb-3">
                    <button id="pdfBtn" onclick="generateReport()" class="btn btn-primary w-100 py-2 rounded-pill shadow-sm">
                        <i class="bi bi-file-earmark-pdf me-2"></i>Download Nexus Core Audit (PDF)
                    </button>
                </div>

                <div class="d-flex gap-3 mt-4">
                    <a href="index.html" class="btn btn-outline-info w-50 py-2 rounded-pill"><i class="bi bi-cpu me-2"></i>Dashboard</a>
                    <button onclick="logout()" class="btn btn-outline-danger w-50 py-2 rounded-pill"><i class="bi bi-power me-2"></i>Logout</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = "login.html";

    window.onload = () => {
        const username = localStorage.getItem('username') || "Nexus User";
        document.getElementById('dispName').innerText = username;
        document.getElementById('valUsername').innerText = username;
        document.getElementById('valEmail').innerText = localStorage.getItem('email') || "---";
        document.getElementById('valProfession').innerText = localStorage.getItem('profession') || "---";
        document.getElementById('dispRole').innerText = (localStorage.getItem('role') || "User").toUpperCase() + "_NODE";
        document.getElementById('userInitial').innerText = username.charAt(0).toUpperCase();
    };

    async function generateReport() {
        const btn = document.getElementById('pdfBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Syncing Data...';

        try {
            const res = await fetch('/api/user/report', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let y = 50;

            // Header
            doc.setFillColor(15, 23, 42);
            doc.rect(0, 0, 210, 40, 'F');
            doc.setFontSize(22);
            doc.setTextColor(0, 242, 255);
            doc.text("NEXUS CORE: INTERACTION AUDIT", 15, 25);

            // 1. User Info Section
            doc.setTextColor(0);
            doc.setFontSize(14);
            doc.text("1. USER PROFILE DATA", 15, 50);
            doc.setFontSize(11);
            doc.text(`Name: ${data.profile.username}`, 20, 60);
            doc.text(`Email: ${data.profile.email}`, 20, 68);
            doc.text(`Profession: ${data.profile.profession}`, 20, 76);
            doc.text(`Account Verified: Active System Node`, 20, 84); // REMOVED BCRYPT LINE

            // 2. Complaints / Support Messages
            y = 100;
            doc.setFontSize(14);
            doc.text("2. SUPPORT & COMPLAINT LOGS", 15, y);
            y += 10;
            doc.setFontSize(10);

            if (data.complaints.length === 0) {
                doc.text("No contact or complaint records submitted by this user.", 20, y);
                y += 10;
            } else {
                data.complaints.forEach((msg, idx) => {
                    if (y > 270) { doc.addPage(); y = 20; }
                    doc.setFont("helvetica", "bold");
                    doc.text(`Ticket #${idx + 1} - Subject: ${msg.subject}`, 20, y);
                    doc.setFont("helvetica", "normal");
                    const msgLines = doc.splitTextToSize(`Message: ${msg.message}`, 160);
                    doc.text(msgLines, 20, y + 5);
                    y += (msgLines.length * 5) + 12;
                });
            }

            // 3. Chat History
            if (y > 250) { doc.addPage(); y = 20; }
            doc.setFontSize(14);
            doc.text("3. CHAT HISTORY (Persistence Layer)", 15, y);
            y += 10;

            if (data.history.length === 0) {
                doc.setFontSize(10);
                doc.text("No records found in database.", 20, y);
            } else {
                data.history.forEach(chat => {
                    chat.messages.forEach(msg => {
                        if (y > 270) { doc.addPage(); y = 20; }
                        doc.setFont("helvetica", "bold");
                        doc.setFontSize(10);
                        doc.text(`${msg.role.toUpperCase()}:`, 20, y);
                        doc.setFont("helvetica", "normal");
                        const lines = doc.splitTextToSize(msg.content, 160);
                        doc.text(lines, 35, y);
                        y += (lines.length * 5) + 7;
                    });
                });
            }

            doc.save(`${data.profile.username}_Full_Report.pdf`);
        } catch (e) {
            alert("Error generating report. Check server connection.");
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-file-earmark-pdf me-2"></i>Download Nexus Core Audit (PDF)';
        }
    }

    function logout() { localStorage.clear(); window.location.href = "login.html"; }
</script>
</body>
</html>
