<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Create Your Intelligence Account</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --dark-bg: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
        }

        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        .signup-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 45px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .brand-logo {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-purple));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        .form-label {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
            margin-left: 4px;
        }

        .form-control, .form-select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white !important;
            border-radius: 14px;
            padding: 12px 16px;
            transition: 0.3s;
        }

        /* Styling the placeholder and select options */
        .form-control::placeholder { color: #475569; }
        .form-select option { background: #1e293b; color: white; }

        .form-control:focus, .form-select:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            outline: none;
        }

        .btn-nexus {
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-purple));
            border: none;
            padding: 15px;
            border-radius: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-nexus:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
            filter: brightness(1.1);
        }

        .input-group-text {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            border-radius: 14px 0 0 14px;
        }

        .has-icon .form-control { border-radius: 0 14px 14px 0; }

        a.text-link {
            color: var(--primary-blue);
            text-decoration: none;
            transition: 0.3s;
        }

        a.text-link:hover { color: var(--accent-purple); }
    </style>
</head>
<body>

<div class="signup-card">
    <div class="text-center mb-4">
        <div class="brand-logo text-white">NX</div>
        <h3 class="fw-bold">Initialize Node</h3>
        <p class="text-secondary small">Connect your profile to the Nexus AI ecosystem</p>
    </div>
    
    <form id="signupForm" onsubmit="handleSignup(event)">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-control" placeholder="NexusID" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="name@domain.com" required>
            </div>
        </div>

        <div class="mt-3">
            <label class="form-label">Mobile (Secure Contact)</label>
            <div class="input-group has-icon">
                <span class="input-group-text"><i class="bi bi-phone"></i></span>
                <input type="text" id="mobile" class="form-control" placeholder="+1 234 567 890">
            </div>
        </div>
        
        <div class="row g-3 mt-1">
            <div class="col-md-6">
                <label class="form-label">Gender</label>
                <select id="gender" class="form-select" required>
                    <option value="" disabled selected>Select...</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other / Prefer not to say</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Profession</label>
                <input type="text" id="profession" class="form-control" placeholder="Developer / Student" required>
            </div>
        </div>

        <div class="mt-3">
            <label class="form-label">Secure Password</label>
            <input type="password" id="pass1" class="form-control mb-3" placeholder="••••••••" required>
            <label class="form-label">Confirm Password</label>
            <input type="password" id="pass2" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-nexus w-100 text-white">Create Secure Account</button>
    </form>
    
    <div class="text-center mt-4 pt-2">
        <span class="text-secondary small">Already part of the network?</span> 
        <a href="login.html" class="text-link small fw-bold ms-1">Login Here</a>
    </div>
</div>

<script>
async function handleSignup(e) {
    e.preventDefault();
    
    // 1. Get DOM elements and values correctly inside the function
    const btn = document.getElementById("submitBtn");
    const p1 = document.getElementById("pass1").value;
    const p2 = document.getElementById("pass2").value;

    // 2. Password Verification
    if (p1 !== p2) { 
        alert("CRITICAL ERROR: Passwords do not match. Please verify."); 
        return; 
    }

    // 3. Disable button to prevent multiple "accidental" database entries
    btn.disabled = true;
    btn.innerText = "Initializing Node...";

    // 4. Prepare Payload
    const body = {
        username: document.getElementById("username").value.trim(),
        email: document.getElementById("email").value.trim(),
        mobile: document.getElementById("mobile").value.trim(),
        gender: document.getElementById("gender").value,
        profession: document.getElementById("profession").value.trim(),
        password: p1
    };

    try {
        // 5. API Call to your local server
        // Note: Using relative path '/api/signup' is safer if frontend and backend are on same port
        const res = await fetch('http://localhost:5000/api/signup', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });

        const data = await res.json();

        if (res.ok) {
            alert("SUCCESS: Node registered. Redirecting to Login...");
            window.location.href = "login.html";
        } else { 
            // Handle server-side validation errors (like duplicate email)
            alert("REGISTRATION FAILED: " + (data.error || "Unknown Error")); 
            btn.innerText = "Create Secure Account";
            btn.disabled = false;
        }
    } catch(err) { 
        console.error("Signup Error:", err);
        alert("NETWORK ERROR: Check if backend is running on port 5000."); 
        btn.innerText = "Create Secure Account";
        btn.disabled = false;
    }
}
</script>

</body>
</html>
