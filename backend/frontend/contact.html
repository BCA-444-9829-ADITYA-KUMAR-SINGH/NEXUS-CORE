<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Contact Support</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #3b82f6;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text-gray: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar Integration */
        .navbar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            backdrop-filter: blur(10px);
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--primary-blue) !important;
        }

        .contact-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .contact-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Info Section */
        .contact-info {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            padding: 45px;
            border-right: 1px solid var(--border);
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 30px;
        }

        .info-icon {
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary-blue);
            padding: 12px;
            border-radius: 12px;
            margin-right: 15px;
            font-size: 1.2rem;
        }

        /* Form Section */
        .contact-form-area {
            padding: 45px;
            background: #0f172a;
        }

        .form-label {
            color: var(--text-gray);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control, .form-select {
            background: #1e293b !important;
            border: 1px solid var(--border);
            color: white !important;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            outline: none;
        }

        .btn-submit {
            background: var(--primary-blue);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            transform: none;
        }

        .btn-back {
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            transition: 0.3s;
        }

        .btn-back:hover {
            color: white;
        }

        @media (max-width: 850px) {
            .contact-card { grid-template-columns: 1fr; }
            .contact-info { display: none; }
        }
    </style>
</head>
<body>

<nav class="navbar d-flex justify-content-between align-items-center">
    <a href="index.html" class="navbar-brand text-decoration-none">NEXUS CORE</a>
    <a href="index.html" class="btn-back">
        <i class="bi bi-house-door me-2"></i> Back to Home
    </a>
</nav>

<div class="contact-wrapper">
    <div class="contact-card">
        
        <div class="contact-info">
            <h3 class="fw-bold mb-3">Help Center</h3>
            <p class="text-secondary small mb-5">Our support team typically responds to inquiries within 24 hours.</p>
            
            <div class="info-item">
                <div class="info-icon"><i class="bi bi-envelope"></i></div>
                <div>
                    <div class="fw-bold small">Official Support</div>
                    <div class="small text-secondary">support@nexuscore.com</div>
                </div>
            </div>

            <div class="info-item">
                <div class="info-icon"><i class="bi bi-hdd-network"></i></div>
                <div>
                    <div class="fw-bold small">System Status</div>
                    <div class="small text-success">All Systems Operational</div>
                </div>
            </div>

            <div class="mt-5 p-3 rounded bg-dark border border-secondary border-opacity-25">
                <p class="text-secondary x-small mb-0" style="font-size: 0.75rem;">
                    <i class="bi bi-info-circle me-1"></i> 
                    Your inquiry will be logged with your secure user session for faster resolution.
                </p>
            </div>
        </div>

        <div class="contact-form-area">
            <h4 class="fw-bold mb-4">Contact Support</h4>
            <form id="contactForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                    </div>
                </div>

                <label class="form-label">Inquiry Subject</label>
                <select id="subject" class="form-select" required>
                    <option value="" disabled selected>Please select a reason</option>
                    <option value="General Inquiry">General Inquiry</option>
                    <option value="Technical Support">Technical Support</option>
                    <option value="Account Access">Account Access</option>
                    <option value="Feedback">Feature Feedback</option>
                    <option value="Other">Other</option>
                </select>

                <label class="form-label">Message Details</label>
                <textarea id="message" class="form-control" rows="5" placeholder="Please describe your issue in detail..." required></textarea>

                <button type="submit" id="submitBtn" class="btn-submit">
                    <i class="bi bi-send-fill me-2"></i> Send Message
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        
        const data = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            subject: document.getElementById('subject').value,
            message: document.getElementById('message').value
        };

        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Sending Message...`;

        try {
            const response = await fetch('http://localhost:5000/api/contact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert("Success: Your support ticket has been created. An administrator will review it shortly.");
                document.getElementById('contactForm').reset();
            } else {
                alert("Error: The Nexus server could not process your request at this time.");
            }
        } catch (error) {
            alert("Network Error: Unable to connect to the Nexus backend server.");
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<i class="bi bi-send-fill me-2"></i> Send Message`;
        }
    });
</script>

</body>
</html>
